version: '3.8'

services:
  eol-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eol_portal_app
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8501
    volumes:
      - ./data:/app/data
      - ./db:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
